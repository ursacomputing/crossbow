# NOTE: must set "Crossbow" as name to have the badge links working in the
# github comment reports!
name: Crossbow
on:
  push:
    branches:
      - "*-github-*"

env:
  ARCHERY_DEBUG: 1
  SCCACHE_ENABLED: ${{ secrets.SCCACHE_REGION != '' }}


permissions:
  contents: read
  # For OIDC token for sccache
  id-token: write

jobs:
  r-linux-sanitizers:
    name: "rhub/${{ matrix.config.r_image }}"
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      R_PRUNE_DEPS: TRUE
      R_ORG: "rhub"
      R_IMAGE: "${{ matrix.config.r_image }}"
      R_TAG: "latest"
    strategy:
      fail-fast: false
      matrix:
        config:
          # See https://r-hub.github.io/containers/
          - { r_image: "clang-asan", skip_vignettes: true }  
          - { r_image: "clang-ubsan", skip_vignettes: true }  
          - { r_image: "gcc-asan", skip_vignettes: true}  # includes both asan and ubsan
    steps:
      - name: Checkout Arrow
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: arrow
          persist-credentials: false
          repository: paultiq/arrow
          ref: 14976326137c05c97e3938234de47e00d8da635c
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          cache: 'pip'
          python-version: 3.12
      - name: Install Archery
        shell: bash
        run: pip install -e arrow/dev/archery[all]


      - name: Configure AWS credentials for sccache
        if: env.SCCACHE_ENABLED == 'true'
        # don't fail the build if AWS credentials are unavailable
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ secrets.SCCACHE_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-duration-seconds: 14400

      - name: Docker Run
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: "${{ env.AWS_ACCESS_KEY_ID }}"
          AWS_SECRET_ACCESS_KEY: "${{ env.AWS_SECRET_ACCESS_KEY }}"
          AWS_SESSION_TOKEN: "${{ env.AWS_SESSION_TOKEN }}"
          SCCACHE_BUCKET: "${{ secrets.SCCACHE_BUCKET }}"
          SCCACHE_REGION: "${{ secrets.SCCACHE_REGION }}"
          SCCACHE_S3_KEY_PREFIX: "sccache"

        run: archery docker run -e SKIP_VIGNETTES=${{ matrix.config.skip_vignettes }} r-san
      - name: Dump install logs
        run: cat arrow/r/arrow.Rcheck/00install.out
        if: always()
      - name: Dump test logs
        run: cat arrow/r/arrow.Rcheck/tests/testthat.Rout*
        if: always()
      - name: Save the test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.config.r_image }}
          path: arrow/r/arrow.Rcheck/tests/testthat.Rout*